# Stage phụ: tinh chỉnh decoder VAE trên ảnh X-quang (encoder ĐÓNG BĂNG)


pretrained_model_name_or_path: "./sd15"
variant: "fp16"
output_dir: "./out/vae_decoder"

data_root: "./data/nih"
resolution: 512
crop_size: 256          # crop ngẫu nhiên: decoder là mạng tích chập nên vẫn tổng quát lên 512
view_position: null  
max_images: 20000
cache_dir: "./cache512"
dataloader_num_workers: 4
sample_posterior: false

learning_rate: 0.00001  # 1e-5 — decoder đã pretrain, lr cao sẽ phá texture
lr_scheduler: "cosine"
lr_warmup_steps: 200
max_train_steps: 6000
train_batch_size: 2
gradient_accumulation_steps: 4
mixed_precision: "fp16"
max_grad_norm: 1.0

l1_weight: 1.0
mse_weight: 0.0
perceptual_weight: 0.1  # đặt 0 nếu máy không tải được weights VGG16

seed: 42
logging_steps: 25
checkpointing_steps: 1000
validation_steps: 500
num_validation_images: 2

wandb_project: "c-dm-multilabel"
wandb_run_name: "vae-decoder"
wandb_mode: "online"
