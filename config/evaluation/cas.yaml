model:
  pretrained_dir: "sd15"
  lora_path: "out/multilabel_att1_att2/lora-9000.safetensors"
  lora_config_path: "out/multilabel_att1_att2/lora_config.json"
  label_encoder_path: "out/multilabel_att1_att2/label_encoder-9000.safetensors"
  version_tag: null

  device: "cuda"
  dtype: "fp16"
  variant: "fp16"

# 3 nhãn thật sự được đánh giá
target_labels:
  - Atelectasis
  - Infiltration
  - Effusion

generation:
  seed: 42
  images_per_combo: 125        # 4 combo x 125 = 500 ảnh
  combos:
    - name: "no_finding"
      labels: ["No Finding"]
    - name: "atelectasis"
      labels: ["Atelectasis"]
    - name: "infiltration"
      labels: ["Infiltration"]
    - name: "effusion"
      labels: ["Effusion"]

  num_inference_steps: 25      
  guidance_scale: 4.0         
  
  height: 512
  width: 512

  output_dir: "data/synthetic"       
  metadata_filename: "metadata.csv"

judge:
  # "trtr" = classifier 5 lớp của chính dự án (khuyến nghị — khớp đúng không gian nhãn)
  # "xrv"  = torchxrayvision, giám khảo ngoài, độc lập với dữ liệu train
  type: "trtr"

  # --- khi type: "trtr" ---
  checkpoint: "./out/eval/trtr_tstr/checkpoints/trtr_seed42.pt"
  img_size: 512
  # Ngưỡng hiệu chỉnh trên tập val THẬT. Sinh ra bằng:
  #   python -m evaluation.cas.judge_trtr --calibrate
  # Thiếu file này thì dùng 0.5 cho mọi nhãn (thường quá cao với nhãn thưa).
  thresholds_path: "./out/eval/trtr_tstr/checkpoints/thresholds.json"

  # --- khi type: "xrv" ---
  model_name: "densenet121-res224-all"
  use_op_threshs: true

  threshold_overrides: {}

evaluation:
  results_dir: "reports/cas"
  bootstrap_iterations: 1000