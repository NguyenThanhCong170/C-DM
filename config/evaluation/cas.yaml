model:
  pretrained_dir: "sd15"
  lora_path: "out/multilabel/lora-final.safetensors"
  lora_config_path: "out/multilabel/lora_config.json"
  label_encoder_path: "out/multilabel/label_encoder-final.safetensors"
  version_tag: null

  device: "cuda"
  dtype: "fp16"
  variant: "fp16"

# 3 nhãn thật sự được đánh giá
target_labels:
  - Atelectasis
  - Infiltration
  - Effusion

generation:
  seed: 42
  images_per_combo: 125        # 4 combo x 125 = 500 ảnh
  combos:
    - name: "no_finding"
      labels: ["No Finding"]
    - name: "atelectasis"
      labels: ["Atelectasis"]
    - name: "infiltration"
      labels: ["Infiltration"]
    - name: "effusion"
      labels: ["Effusion"]

  num_inference_steps: 25      
  guidance_scale: 4.0         
  
  height: 512
  width: 512

  output_dir: "data/synthetic"       
  metadata_filename: "metadata.csv"

judge:
  model_name: "densenet121-res224-nih"   
  use_op_threshs: true                   
  threshold_overrides: {}                

evaluation:
  results_dir: "reports/cas"
  bootstrap_iterations: 1000